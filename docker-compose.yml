version: '3.8'

services:
  mongodb:
    image: mongo:7-jammy
    container_name: jobpilot-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: jobpilot

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: jobpilot-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:80
      MONGODB_URI: mongodb://mongodb:27017/jobpilot
      JWT_SECRET: jobpilot_production_secret_key_987654321
      JWT_EXPIRES_IN: 7d
      ENABLE_CRON_SYNC: "true"
      JOB_SYNC_CRON: "0 */6 * * *"
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: jobpilot-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
