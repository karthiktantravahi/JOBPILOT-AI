services:
  # Backend API
  - type: web
    name: jobpilot-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ENABLE_CRON_SYNC
        value: "true"
      - key: JOB_SYNC_CRON
        value: "0 */6 * * *"
      - key: CLIENT_URL
        fromService:
          type: web
          name: jobpilot-web
          property: host

  # Frontend Static Site
  - type: web
    name: jobpilot-web
    runtime: static
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: jobpilot-api
          property: url
